      {id:"tree",icon:"trees",cat:"Environment",title:"Tree Plantation",catMr:"पर्यावरण",titleMr:"वृक्षारोपण",location:"Vishrantwadi, Pune",locationMr:"विश्रांतवाडी, पुणे",date:"1 May 2026",dateMr:"१ मे २०२६",summaryMr:"सिद्धेश्वर नगर को-ऑपरेटिव्ह हाऊसिंग सोसायटी लिमिटेड, विश्रांतवाडी, पुणे येथे संस्थेतर्फे १०० झाडे उपलब्ध करून देऊन त्यांचे वृक्षारोपण करण्यात आले.",storyMr:"सिद्धेश्वर नगर को-ऑपरेटिव्ह हाऊसिंग सोसायटी लिमिटेड, विश्रांतवाडी, पुणे येथील डॉ. ज्योती चव्हाण यांनी संस्थेकडे १०० झाडांची मागणी केली होती. सोसायटीमध्ये आधीपासून विविध प्रकारची झाडे असून तेथील रहिवाशांना वृक्षसंवर्धनाची विशेष आवड आहे. संस्थेने ही मागणी पूर्ण करून १०० झाडे उपलब्ध करून दिली व वृक्षारोपण केले. या कार्याची दखल घेऊन १ मे २०२६ रोजी महाराष्ट्र दिनानिमित्त आयोजित कार्यक्रमात द्वारकामाई संस्थेचा सत्कार करण्यात आला. या उपक्रमासाठी श्री. चंद्रकांत पवार आणि श्री. गिरीश भोंडे यांनी पूर्ण सहकार्य केले.",whyMr:"पर्यावरण संवर्धन, हरित परिसर निर्माण करणे आणि समाजामध्ये वृक्षांविषयी जागरूकता वाढवणे या उद्देशाने हा उपक्रम राबविण्यात आला.",supportMr:"संस्थेतर्फे १०० झाडे उपलब्ध करून देऊन सोसायटीच्या सहकार्याने त्यांचे वृक्षारोपण करण्यात आले.",impactMr:"हा उपक्रम संस्थेच्या सातत्यपूर्ण वृक्षारोपण आणि पर्यावरण जनजागृती कार्याचा एक भाग आहे.",summary:"Provided and planted 100 trees at Siddheshwar Nagar Co-operative Housing Society Limited, Vishrantwadi, Pune.",story:"Following a request from Dr. Jyoti Chavan and the Siddheshwar Nagar Co-operative Housing Society Limited, Dwarkamai Sanstha provided and planted 100 trees. The society is known for tree-loving residents and existing greenery. On Maharashtra Day, 1 May 2026, the society organised a programme and felicitated Dwarkamai Sanstha. Shri Chandrakant Pawar and Shri Girish Bhonde supported the initiative.",why:"The initiative supported an existing community commitment to greenery and environmental awareness.",support:"100 trees were provided and planted with support from the housing society and the organization’s team.",impact:"The activity adds to       {id:"water",icon:"droplets",cat:"Education & Health",title:"Clean Drinking Water / Water Filter",catMr:"शिक्षण आणि आरोग्य",titleMr:"स्वच्छ पिण्याचे पाणी / वॉटर फिल्टर",location:"Dehane, Bhimashankar",locationMr:"देहणे, भिमाशंकर",summaryMr:"देहणे गावातील जिल्हा परिषद शाळेतील विद्यार्थ्यांसाठी स्वच्छ पिण्याच्या पाण्याची व्यवस्था करण्यासाठी वॉटर फिल्टर उपलब्ध करून देण्यात आला.",storyMr:"भिमाशंकर परिसरातील देहणे गावातील जिल्हा परिषद शाळेत लहान मुलांसाठी स्वच्छ पिण्याच्या पाण्याची योग्य सुविधा उपलब्ध नसल्याचे संस्थेच्या निदर्शनास आले. विद्यार्थ्यांच्या आरोग्याचा विचार करून द्वारकामाई संस्थेने शाळेसाठी वॉटर फिल्टरची व्यवस्था केली.",whyMr:"शाळेतील मुलांना स्वच्छ आणि सुरक्षित पिण्याचे पाणी उपलब्ध व्हावे यासाठी हा उपक्रम राबविण्यात आला.",supportMr:"जिल्हा परिषद शाळेसाठी वॉटर फिल्टर उपलब्ध करून देण्यात आला.",impactMr:"दुर्गम आणि आदिवासी भागातील शाळेची एक महत्त्वाची मूलभूत गरज या उपक्रमाद्वारे पूर्ण करण्यात आली.",summary:"A water filter was arranged at Zilla Parishad School, Dehane village.",story:"Students at the Zilla Parishad School in Dehane village, Bhimashankar region, did not have proper clean drinking-water facilities. Dwarkamai Sanstha arranged a water filter for the school.",why:"Access to clean drinking water is important for children’s comfort and wellbeing during the school day.",support:"A water filter was arranged for the school.",impact:"The support addressed a practical school need in a remote, tribal-region community."},

      $("footer-links").innerHTML=["home","about","activities","donations","contact"].map(x=>`<a class="hover:text-white focus-ring" href="#${x}">${t().nav[x]}</a>`).join("");

    function openStory(id){
      navigate("#activities");
      activeStory=id;
      const a=id==="dehane"?{title:t().dehaneTitle,cat:currentLang==="mr"?"शिक्षण आणि ग्रामीण विकास":"Education & Rural Development",location:t().dehaneLocation.replace("Location: ",""),story:t().dehaneCopy,why:currentLang==="mr"?"दुर्गम व आदिवासी भागातील शाळेच्या गरजा ओळखून हे सहाय्य करण्यात आले.":"This support responded to the needs of a school in a remote tribal region.",support:currentLang==="mr"?"पाणी, उबदार कपडे, शैक्षणिक साहित्य, क्रीडा साहित्य आणि पोषण सहाय्य.":"Water, warm clothing, educational materials, sports support, and nutritious items.",impact:currentLang==="mr"?"शाळेतील मुलांच्या दैनंदिन शिक्षण आणि कल्याणाच्या गरजांना प्रतिसाद दिला.":"The assistance responded to students’ everyday learning and wellbeing needs."}:activities.find(x=>x.id===id);
      $("activity-list-view").style.display="none"; $("activity-detail").classList.add("active");
      $("detail-media-label").textContent=currentLang==="mr"?"फोटो / मीडिया उपलब्ध करायचे आहे":"Featured media to be supplied";
      $("detail-category").textContent=currentLang==="mr"?a.catMr:a.cat; $("detail-title").textContent=currentLang==="mr"?a.titleMr:a.title;
      $("detail-meta").innerHTML=`${a.date?`<span class="inline-flex gap-2 items-center"><i data-lucide="calendar" class="w-4 h-4 text-blue-700"></i>${a.date}</span>`:""}${(currentLang==="mr"?a.locationMr:a.location)?`<span class="inline-flex gap-2 items-center"><i data-lucide="map-pin" class="w-4 h-4 text-blue-700"></i>${currentLang==="mr"?a.locationMr:a.location}</span>`:""}<span class="inline-flex gap-2 items-center"><i data-lucide="users" class="w-4 h-4 text-blue-700"></i>${currentLang==="mr"?"लाभार्थी: माहिती निश्चित करायची आहे":"Beneficiaries: To be confirmed"}</span>`;
      const labels=currentLang==="mr"?["कथा","हा उपक्रम का आयोजित करण्यात आला","सहाय्य","प्रभाव","संबंधित कार्य"]:["Story","Why This Activity Was Organized","Support Provided","Impact","Related Work"];
      $("detail-content").innerHTML=`<section><h4 class="font-bold text-blue-950 text-xl mb-2">${labels[0]}</h4><p>${currentLang==="mr"?a.storyMr:a.story}</p></section><section><h4 class="font-bold text-blue-950 text-xl mb-2">${labels[1]}</h4><p>${currentLang==="mr"?a.whyMr:a.why}</p></section><section><h4 class="font-bold text-blue-950 text-xl mb-2">${labels[2]}</h4><p>${currentLang==="mr"?a.supportMr:a.support}</p></section><section><h4 class="font-bold text-blue-950 text-xl mb-2">${labels[3]}</h4><p>${currentLang==="mr"?a.impactMr:a.impact}</p></section><section class="rounded-xl bg-blue-50 p-4"><h4 class="font-bold text-blue-950 mb-2">${labels[4]}</h4><p class="text-sm">${currentLang==="mr"?"शिक्षण, कौशल्य विकास, पर्यावरण, महिला सक्षमीकरण आणि ग्रामीण कल्याण.":"Education, skill development, rural empowerment, environmental awareness, and community welfare."}</p></section>`;
      lucide.createIcons(); window.scrollTo(0,0);
    }
    function closeStory(){ $("activity-detail").classList.remove("active"); $("activity-list-view").style.display="block"; $("share-notice").classList.remove("show"); activeStory=null; window.scrollTo(0,0); }

    function applyLanguage(lang){ currentLang=lang; localStorage.setItem("dwarkamai-lang",lang); renderStatic(); renderCollections(); if(activeStory) openStory(activeStory); }
    function navigate(hash){ const page=(hash||"#home").replace("#",""); document.querySelectorAll(".page-section").forEach(s=>s.classList.remove("active")); ($("sec-"+page)||$("sec-home")).classList.add("active"); document.querySelectorAll(".nav-link").forEach(a=>a.classList.toggle("active",a.dataset.nav===page)); $("mobile-menu").classList.remove("open"); $("mobile-menu-btn").setAttribute("aria-expanded","false"); if(page!=="activities") closeStory(); window.scrollTo(0,0); }

    document.addEventListener("click", e=>{
      const story=e.target.closest(".open-story,.open-special-story"); if(story) openStory(story.dataset.id||story.dataset.story);
      const placeholder=e.target.closest(".placeholder-action"); if(placeholder){ e.preventDefault(); placeholder.dataset.original=placeholder.textContent; placeholder.textContent=currentLang==="mr"?"दुवा निश्चित करायचा आहे":"Link to be confirmed"; setTimeout(()=>{ if(placeholder.dataset.actionLabel) placeholder.textContent=t().actions[placeholder.dataset.actionLabel]; },1800); }
      const tab=e.target.closest(".gallery-tab"); if(tab){ document.querySelectorAll(".gallery-tab").forEach(x=>x.className="gallery-tab focus-ring rounded-full px-4 py-2 text-sm font-bold bg-blue-50 text-blue-900"); tab.className="gallery-tab focus-ring rounded-full px-4 py-2 text-sm font-bold bg-[#123b78] text-white"; document.querySelectorAll(".gallery-item").forEach(x=>x.classList.toggle("show",tab.dataset.cat==="All"||x.dataset.cat===tab.dataset.cat)); }
    });
    $("back-activities").addEventListener("click",closeStory);
    $("share-story").addEventListener("click",async()=>{ const title=$("detail-title").textContent; try{ if(navigator.share) await navigator.share({title,text:title}); else { await navigator.clipboard.writeText(title); $("share-notice").textContent=currentLang==="mr"?"उपक्रमाचे शीर्षक कॉपी केले आहे.":"Activity title copied."; $("share-notice").classList.add("show"); } }catch(e){} });
    $("lang-toggle").addEventListener("click",()=>applyLanguage(currentLang==="en"?"mr":"en"));
    document.querySelectorAll(".lang-btn").forEach(b=>b.addEventListener("click",()=>applyLanguage(b.dataset.lang)));
    $("mobile-menu-btn").addEventListener("click",()=>{$("mobile-menu").classList.add("open"); $("mobile-menu-btn").setAttribute("aria-expanded","true");});
    $("mobile-menu-close").addEventListener("click",()=>{$("mobile-menu").classList.remove("open"); $("mobile-menu-btn").setAttribute("aria-expanded","false");});
    window.addEventListener("hashchange",()=>navigate(location.hash));
    $("projects-home-link").addEventListener("click",()=>{ setTimeout(()=>$("major-projects").scrollIntoView({behavior:"smooth",block:"start"}),80); });
    window.addEventListener("DOMContentLoaded",()=>{applyLanguage(currentLang); navigate(location.hash||"#home"); lucide.createIcons();});
  </script>
